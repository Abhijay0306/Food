services:
  - type: web
    name: hypereats-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/auth/me
    envVars:
      - key: MONGO_URL
        sync: false          # Set manually in Render dashboard
      - key: DB_NAME
        value: hypereats
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a strong random string
      - key: STRIPE_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false          # Set to your Vercel URL after deployment
      - key: ADMIN_EMAIL
        value: admin@hypereats.com
      - key: ADMIN_PASSWORD
        generateValue: true
